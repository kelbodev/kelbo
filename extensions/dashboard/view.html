<div class="empty-state" data-role="empty"><div class="icon"><i data-icon="layout-dashboard"></i></div><p data-role="empty-text"></p></div>
<div class="dash" data-role="board" hidden>
  <div class="dash-head">
    <h2 class="dash-title" data-role="title"></h2>
    <span class="dash-path" data-role="path"></span>
    <div class="dash-actions">
      <button class="btn btn-ghost btn-sm" data-action="add"><i data-icon="plus"></i> <span data-i18n="board.add"></span></button>
      <button class="btn btn-ghost btn-sm" data-action="reset" data-i18n="board.reset" data-i18n-title="board.resetTitle"></button>
    </div>
  </div>
  <div class="dash-grid" data-role="grid"></div>
</div>
