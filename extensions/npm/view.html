<div class="empty-state" data-role="empty"><div class="icon"><i data-icon="package"></i></div><p data-i18n="empty"></p></div>
<div class="npm-area" data-role="project" hidden>
  <div class="npm-detail-header">
    <h3 data-role="title"></h3>
    <div class="npm-detail-meta">
      <div class="path-label" data-role="path"></div>
      <span class="npm-running" data-role="running"></span>
      <button class="btn btn-ghost btn-sm npm-tunnels-btn" data-role="tunnels" onclick="Ext.npm.tunnels()" data-i18n-title="tunnels.buttonTitle" hidden></button>
      <button class="btn btn-ghost btn-sm" data-role="angular" onclick="Ext.npm.angular()" data-i18n-title="angular.title" hidden><i data-icon="triangle"></i> Angular CLI</button>
    </div>
  </div>
  <div class="npm-tabs">
    <button class="npm-tab" data-tab="scripts"><i data-icon="play"></i> <span data-i18n="tab.scripts"></span></button>
    <button class="npm-tab" data-tab="packages"><i data-icon="package"></i> <span data-i18n="tab.packages"></span></button>
  </div>
  <div class="npm-tab-content" data-role="tab-content"></div>
</div>
