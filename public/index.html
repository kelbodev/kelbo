<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelbo</title>
<link rel="icon" type="image/svg+xml" href="icons/kelbo.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0d1117">
<meta name="application-name" content="Kelbo">
<meta name="apple-mobile-web-app-title" content="Kelbo">
<link rel="stylesheet" href="core/shell.css">
</head>
<body>

<!-- ================================================================
     HEADER
================================================================ -->
<header>
  <div class="header-top">
    <div class="logo">Kel<span>bo</span></div>
    <!-- pill delle estensioni (ctx.setPills) -->
    <div class="header-pills" id="activePills"></div>
    <div class="header-actions">
      <button class="btn btn-ghost lang-btn" id="langBtn" onclick="Shell.chooseLanguage(event)" data-i18n-title="core.language.choose" hidden><i data-icon="globe"></i> <span class="lang-code"></span></button>
      <button class="btn btn-ghost" id="themeBtn" onclick="Theme.choose(event)" data-i18n-aria-label="core.theme.choose"><i data-icon="palette"></i></button>
      <button class="notif-btn" id="notifBtn" onclick="Shell.toggleNotifications()" data-i18n-title="core.notifications.enable"><i data-icon="bell"></i></button>
      <button class="btn btn-ghost" onclick="Shell.exportConfig()" data-i18n-title="core.export.buttonTitle"><i data-icon="download"></i> <span data-i18n="core.export.button"></span></button>
      <label class="btn btn-ghost" style="cursor:pointer" data-i18n-title="core.import.buttonTitle"><i data-icon="upload"></i> <span data-i18n="core.import.button"></span><input type="file" accept=".json" style="display:none" onchange="Shell.importConfig(this)"></label>
      <button class="btn btn-ghost" id="projectsBtn" onclick="Projects.openPanel()" data-i18n-title="core.projects.buttonTitle"><i data-icon="folder-git-2"></i></button>
      <button class="btn btn-ghost ext-admin-btn" id="extAdminBtn" onclick="Extensions.open()" data-i18n-title="core.ext.buttonTitle"><i data-icon="puzzle"></i><span class="section-tab-badge" id="extAdminBadge" style="display:none"></span></button>
      <button class="btn btn-ghost" onclick="Shell.openMcp()" data-i18n-title="core.mcp.buttonTitle"><i data-icon="bot"></i></button>
      <button class="btn btn-ghost" onclick="Shell.refresh()" data-i18n-title="core.action.refresh"><i data-icon="refresh-cw"></i></button>
    </div>
  </div>
  <!-- Section navigation -->
  <nav class="section-nav">
  </nav>
</header>

<!-- ================================================================
     APP BODY
================================================================ -->
<div class="app">
  <!-- SIDEBAR — contenuto cambia in base alla sezione -->
  <nav class="sidebar" id="sidebar"><div class="sidebar-resizer" id="sidebarResizer" role="separator" aria-orientation="vertical" tabindex="0" data-i18n-title="core.sidebar.resize" data-i18n-aria-label="core.sidebar.resize"></div></nav>

  <!-- MAIN CONTENT: un pannello per sezione, mostrato/nascosto -->
  <main class="main" style="position:relative">
  </main>

  <!-- BARRA A DESTRA: estensioni in posizione "sidebar" (nascosta se non ce ne sono) -->
  <nav class="right-rail" id="rightRail" hidden data-i18n-aria-label="core.rail.label"></nav>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h3 id="modalTitle"></h3>
      <button class="btn-icon" onclick="UI.closeModal()" data-i18n-aria-label="core.action.close"><i data-icon="x"></i></button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="core/i18n.js"></script>
<script src="core/ui.js"></script>
<script src="core/theme.js"></script>
<script src="core/projects.js"></script>
<script src="core/vault.js"></script>
<script src="core/self-update.js"></script>
<script src="core/extensions.js"></script>
<script src="core/shell.js"></script>
</body>
</html>
